
name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q project.zip -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts

      - name: Build APK
        working-directory: extracted
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyStudyTranslator-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
